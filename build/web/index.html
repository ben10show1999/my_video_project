<!DOCTYPE html>
<html>
<head>
  <base href="/">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <title>Video Project</title>
  <style>
    /* ✅ Task 6: Global Anti-Piracy Shield */
    body { 
      background-color: #000000; margin: 0; padding: 0; overflow: hidden; 
      -webkit-touch-callout: none; -webkit-user-select: none; -khtml-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none;
    }
    #loader-msg {
      position: fixed; bottom: 8vh; left: 50%; transform: translateX(-50%); width: fit-content; max-width: 80vw;
      background-color: rgba(20, 20, 20, 0.95); color: #ffffff; padding: 12px 24px; border-radius: 50px;
      font-family: sans-serif; font-size: 14px; font-weight: 500; border: 1px solid rgba(255, 255, 255, 0.15);
      transition: opacity 0.5s ease; z-index: 9999; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
  </style>
</head>
<body oncontextmenu="return false;" ondragstart="return false;">
  <div id="loader-msg">جار تحميل التطبيق الذكي</div>
  <script>
    document.addEventListener('contextmenu', event => event.preventDefault());
    document.addEventListener('dragstart', event => event.preventDefault());

    // ✅ Task 3: THE BLACK HOLE PROTOCOL (Media Session Paralyzed)
    if ('mediaSession' in navigator) {
      const bh = function(){}; // Black Hole Function
      const fakeSession = { playbackState: 'none', setActionHandler: bh, setPositionState: bh };
      // 1. Strip Identity (Null Setter)
      Object.defineProperty(fakeSession, 'metadata', { get: function() { return null; }, set: function(val) { /* Completely swallowed */ } });
      // 2. Paralyze the API object
      Object.defineProperty(navigator, 'mediaSession', { get: function() { return fakeSession; }, set: function(val) { /* Block Overrides */ } });
    }

    const msgDiv = document.getElementById('loader-msg');
    window.addEventListener('flutter-first-frame', function() { msgDiv.style.opacity = '0'; setTimeout(() => msgDiv.remove(), 500); });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
