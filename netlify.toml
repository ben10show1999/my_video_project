[build]
  # تحميل بيئة Flutter (3.44.4) وبناء المشروع تلقائياً في خوادم Netlify (Zero-CLI)
  command = "if [ ! -d \"_flutter\" ]; then git clone -b 3.44.4 https://github.com/flutter/flutter.git _flutter; fi && ./_flutter/bin/flutter pub get && ./_flutter/bin/flutter build web --wasm"
  publish = "build/web"

[[redirects]]
  # توجيه جميع المسارات إلى index.html لضمان عمل توجيهات Flutter بشكل صحيح (SPA)
  from = "/*"
  to = "/index.html"
  status = 200
